[project]
name = "latex-web-tool-backend"
version = "0.1.0"
description = "FastAPI backend for the Latex Web Tool formula recognition platform."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
